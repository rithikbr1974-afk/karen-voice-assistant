<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAREN HANDS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05020a; --primary: #9d4eff; --magenta: #e04dff; --amber: #ffb547; --green: #4dffb0; --red: #ff4d5e;
  --text: #f1e9ff; --muted: rgba(214, 196, 255, 0.6); --glass: rgba(26, 10, 46, 0.62); --edge: rgba(157, 78, 255, 0.32);
  --display: "Orbitron", "Segoe UI", sans-serif; --body: "Rajdhani", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  background: radial-gradient(ellipse at 50% 45%, #1a0a30 0%, #0b0416 38%, var(--bg) 70%);
  color: var(--text); font-family: var(--body); font-size: 15px; user-select: none;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
header {
  position: fixed; top: 0; left: 0; right: 0; height: 58px; padding: 0 22px; display: flex; align-items: center;
  gap: 18px; background: linear-gradient(rgba(5,2,10,.85), rgba(5,2,10,0)); z-index: 5;
}
header h1 { margin: 0; font-family: var(--display); font-size: 18px; letter-spacing: .5em; font-weight: 700; }
header .mode { font-family: var(--display); font-size: 10px; letter-spacing: .3em; color: var(--primary); }
header .spacer { flex: 1; }
.btn {
  font-family: var(--display); font-size: 10px; letter-spacing: .18em; color: var(--text); background: var(--glass);
  border: 1px solid var(--edge); border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--primary); box-shadow: 0 0 14px rgba(157,78,255,.45); }
.btn.on { background: rgba(157,78,255,.35); border-color: var(--primary); }

/* camera picture-in-picture */
#cam {
  position: fixed; right: 18px; bottom: 18px; width: 320px; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--edge); background: #000; box-shadow: 0 0 30px rgba(157,78,255,.25); z-index: 4;
}
#cam video, #cam canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); }
#cam video { object-fit: cover; opacity: .55; }
body.phone #cam, body.train #cam { width: 560px; right: 50%; transform: translateX(50%); bottom: 90px; }
body.train #cam { bottom: 120px; }

/* status pill: control on/off, current gesture */
#status {
  position: fixed; left: 18px; bottom: 18px; z-index: 4; padding: 12px 16px; border-radius: 14px; min-width: 260px;
  background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(8px);
}
#status .big { font-family: var(--display); font-size: 13px; letter-spacing: .22em; }
#status .big.on { color: var(--green); text-shadow: 0 0 12px rgba(77,255,176,.6); }
#status .big.off { color: var(--muted); }
#status .line { color: var(--muted); margin-top: 6px; font-size: 14px; }
#hold { height: 4px; border-radius: 4px; background: rgba(255,255,255,.08); margin-top: 8px; overflow: hidden; }
#hold i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--magenta)); }

/* cheat sheet */
#help {
  position: fixed; left: 18px; top: 70px; z-index: 4; padding: 12px 16px; border-radius: 14px; width: 270px;
  background: var(--glass); border: 1px solid var(--edge); font-size: 14px; line-height: 1.55;
}
#help h3 { margin: 0 0 6px; font-family: var(--display); font-size: 10px; letter-spacing: .28em; color: var(--primary); }
#help b { color: var(--text); font-weight: 600; }
#help div { color: var(--muted); }

/* messages, file name, drop hint */
#toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 6; padding: 10px 18px; border-radius: 999px;
  background: var(--glass); border: 1px solid var(--edge); opacity: 0; transition: opacity .3s; font-size: 15px;
}
#toast.show { opacity: 1; }
#empty {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  color: var(--muted); font-size: 18px; pointer-events: none; z-index: 1;
}
#empty .title { font-family: var(--display); letter-spacing: .3em; color: var(--text); font-size: 15px; }
body.drag #empty { color: var(--primary); }
body.phone #stage, body.phone #empty, body.train #stage, body.train #empty { display: none; }

/* training card */
#train {
  position: fixed; top: 76px; left: 50%; transform: translateX(-50%); width: 560px; z-index: 5; display: none;
  padding: 18px 22px; border-radius: 16px; background: var(--glass); border: 1px solid var(--edge); text-align: center;
}
body.train #train { display: block; }
#train .step { font-family: var(--display); font-size: 10px; letter-spacing: .3em; color: var(--primary); }
#train .what { font-size: 30px; font-weight: 600; margin: 8px 0 4px; }
#train .how { color: var(--muted); font-size: 16px; }
#train .bar { height: 6px; border-radius: 6px; background: rgba(255,255,255,.08); margin-top: 14px; overflow: hidden; }
#train .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--magenta)); }
#train .btn { margin-top: 14px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<header>
  <h1>KAREN</h1><span class="mode" id="mode">HANDS · 3D</span>
  <span class="spacer"></span>
  <button class="btn" id="btn-open" title="Open a 3D file (GLB, GLTF, FBX, OBJ, STL, VRM)">OPEN FILE</button>
  <button class="btn" id="btn-next" title="Next 3D file in the same folder">NEXT</button>
  <button class="btn" id="btn-reset" title="Reset the view">RESET</button>
  <button class="btn" id="btn-train" title="Teach Karen your hand gestures">TRAIN</button>
  <button class="btn" id="btn-control" title="Turn hand control on/off (or hold an open palm for 1 s)">HANDS OFF</button>
</header>
<div id="empty"><div class="title">DROP A 3D FILE HERE</div><div>GLB · GLTF · FBX · OBJ · STL · VRM — or click OPEN FILE, or ask Karen</div></div>
<div id="help"></div>
<div id="status"><div class="big off" id="ctl">HAND CONTROL OFF</div><div class="line" id="gesture">Starting the camera…</div><div id="hold"><i></i></div></div>
<div id="cam"><video id="video" playsinline muted></video><canvas id="overlay"></canvas></div>
<div id="train"><div class="step" id="t-step">TRAINING</div><div class="what" id="t-what"></div><div class="how" id="t-how"></div>
  <div class="bar"><i id="t-bar"></i></div><button class="btn" id="t-go">START</button></div>
<div id="toast"></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/",
               "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js" } }
</script>
<script type="module" src="hands.js"></script>
</body>
</html>
