<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karen Island</title>
<link rel="stylesheet" href="island.css">
</head>
<body>
<div id="app">
  <header>
    <label class="field">
      <i id="dot"></i>
      <input id="ask" placeholder="Ask Karen" autocomplete="off" spellcheck="false">
      <kbd id="keyhint" hidden></kbd>
    </label>
    <button id="mic" class="btn solid" title="Talk">
      <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3Zm7 9a7 7 0 0 1-14 0m7 7v3"/></svg>
    </button>
    <button id="mute" class="btn" title="Mute Karen's microphone">
      <svg viewBox="0 0 24 24"><path id="muteIcon" d="M3 3l18 18M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M19 12a7 7 0 0 1-1.1 3.8M5 12a7 7 0 0 0 11.2 5.6M12 19v3"/></svg>
    </button>
    <button id="big" class="btn" title="Open Karen's main window">
      <svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
    </button>
  </header>

  <section id="clip" class="card" hidden>
    <div class="cardhead"><small id="clipLabel">Copied text</small><button class="x" data-clip="dismiss" title="Not now">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p id="clipText"></p>
    <div class="acts">
      <button data-clip="summarise">Summarise</button><button data-clip="translate">Translate</button><button data-clip="explain">Explain</button>
    </div>
  </section>

  <section id="files" class="card" hidden>
    <div class="cardhead"><small id="filesLabel">Attached</small></div>
    <div id="fileList"></div>
    <div class="acts" id="fileActs"></div>
  </section>

  <section id="song" hidden>
    <div class="glow"></div>
    <div class="art"><img id="songImg" alt=""><span>♫</span></div>
    <div class="meta">
      <small id="songApp"></small>
      <b id="songTitle"></b>
      <span id="songArtist"></span>
    </div>
    <div class="prog" id="songProg">
      <time id="songPos">0:00</time>
      <div class="track" id="songTrack" title="Drag to jump"><i id="songBar"></i><em id="songKnob"></em></div>
      <time id="songLeft">0:00</time>
    </div>
    <div class="ctls">
      <button class="ctl" data-music="previous" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6V6Zm3.5 6 8.5 6V6l-8.5 6Z"/></svg></button>
      <button class="ctl play" id="playPause" data-music="toggle" title="Pause"><svg viewBox="0 0 24 24"><path id="ppIcon" d="M7 5h3.5v14H7V5Zm6.5 0H17v14h-3.5V5Z"/></svg></button>
      <button class="ctl" data-music="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2V6ZM6 18l8.5-6L6 6v12Z"/></svg></button>
    </div>
    <div class="vol" id="vol" hidden>
      <button id="volMute" class="volbtn" title="Mute the PC"><svg viewBox="0 0 24 24"><path id="volIcon" d=""/></svg></button>
      <input id="volRange" type="range" min="0" max="100" step="1" aria-label="PC volume">
      <span id="volVal"></span>
    </div>
  </section>

  <section id="confirm" class="card" hidden>
    <small class="warn">Karen needs your OK</small>
    <p id="question"></p>
    <div class="row"><button id="no" class="pill">No</button><button id="yes" class="pill yes">Yes</button></div>
  </section>

  <section id="map" hidden>
    <div class="maphead"><b id="mapTitle"></b><a id="mapLink" href="#">Open in Google Maps ↗</a><button id="mapClose" class="x" title="Close the map">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <iframe id="mapFrame" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
  </section>

  <section id="talk"></section>

  <section id="chips"></section>
</div>
<script src="island.js"></script>
</body>
</html>
