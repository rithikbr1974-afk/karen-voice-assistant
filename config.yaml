  meeting:     # servers/meeting/server.py: meeting notes (recording, live transcript, final notes); not study mode
    label: Meeting notes
    short: Meetings
    command: "{python}"
    args: [servers/meeting/server.py]
    timeout: 900          # stop = last transcripts + cuts + slides read + notes in parts (Groq: 8K tokens/min): 1-7 min
    triggers:             # "start / stop taking meeting notes" are caught before the LLM (core/meeting.py)
      "start_meeting_notes|stop_meeting_notes|meeting_notes_so_far|show_meeting_notes|past_meetings":
        [meeting notes, meeting minutes, notes of the meeting, record the meeting, record this meeting,
         recording the meeting, in the meeting, during the meeting, the meeting so far, in the lecture, in the class,
         on the call, last meeting, action items, past meeting, previous meeting, meeting on, meeting yesterday,
         meeting today, meeting last, lecture notes, the lecture, that meeting, the meeting]
      "meeting_followup_email": [follow-up, follow up, followup, recap email, meeting email, email the notes,
                                 mail the notes, send the notes]
  brain:       # servers/brain/server.py: the Cortex's hearing memory (what was said around her, last 24 h)
    label: Hearing memory
    short: Hearing
    command: "{python}"
    args: [servers/brain/server.py]
    triggers:
      "heard|hearing_status": [heard, hear that, did you hear, what did he say, what did she say, what did they say,
                               what was he saying, what was she saying, what were they saying, just said, said just now,
                               a minute ago, on tv, the tv, that video, the video say, video said, overheard,
                               what was i saying, what did i say, hearing memory]
      "delete_heard": [forget what you heard, erase what you heard, delete what you heard, clear your hearing,
                       delete hearing memory, erase hearing memory]

confirm: ["artemis__phone_do", "jarvis__tidy_folder_apply", "jarvis__batch_rename_apply", "*batch_modify_gmail*", "*manage_gmail_filter*", "*manage_gmail_label*", "*send*", "*delete*", "*trash*", "*manage_event*", "*shutdown*", "*restart*", "pc__sleep", "pc__power_mode", "pc__clean_junk",
          "dev__git_commit", "dev__git_push", "phone__phone_call", "alexa__power_appliance", "alexa__alexa_command", "alexa__run_routine"]   # spoken yes/no first

avatar:                  # avatar mode characters (Settings > Avatar); more in docs/AVATARS.md
  characters:
    - id: karen
      name: Karen (girl)
      file: models/karen.vrm                  # VRM: full face, expressions and lip-sync (pixiv's sample model)
    # your own VRM or Mixamo-rigged FBX characters:
    # - {id: mia, name: Mia, file: models/avatars/mia.vrm, credit: "the model's author"}

explore:
  camera: 0              # webcam index (0 = Integrated Webcam)
  camera_on_s: 60        # the camera stays on this long after a look, for follow-ups, then turns off
  vision_model: deepseek/deepseek-v4.1-flash
  browser: edge          # research mode windows: edge, chrome or brave
  top_results: 5         # real web results (free search, no key) in the "top articles" window
  # report_model: deepseek/deepseek-v4.1-flash   # writes reports/summaries (unset = the same free fallback chain)
  modes:                 # work modes: "coding mode on" ... "mode off". project = folder opened in VS Code,
    coding:              # apps = programs/URIs to start, urls = one browser window, music = minimized window
      project: ""          # a folder to open in VS Code, e.g. "%USERPROFILE%/Documents/my-project"
      urls: [https://github.com, https://stackoverflow.com, https://docs.python.org/3/]
      music: https://www.youtube.com/watch?v=jfKfPfyJRdk          # lofi hip hop radio (live)
    chill:
      urls: [https://www.youtube.com]
      music: https://music.youtube.com

phone:
  device: ""             # adb serial of the main phone; empty = whichever connected phone isn't `second`
  second: []             # optional second phone (adb serials) for "call from the other number"
  max_steps: 14          # phone_operate actions per task
  settle_s: 1.2          # wait after each tap before reading the screen again
  # model: deepseek/deepseek-v4.1-flash   # unset = the free zero-retention fallback

artemis:                 # the phone agent (github.com/google/artemis, installed by hand in dir with its own .env and Gemini key)
  dir: ""                # where you installed github.com/google/artemis
  profile: flash         # flash = fast, ~3-5 s per step; pro = plans and verifies, ~15-40 s per step
  timeout_s: 240         # a task is stopped after this long

phone_watch:             # voice Karen says incoming calls and new messages from the paired phone (core/phonewatch.py)
  enabled: true
  calls: true            # "Alex is calling. Pick up or reject?"
  messages: true         # "WhatsApp from Mom: ..." (security codes hidden; only "New WhatsApp" while face-locked)
  apps: [com.whatsapp, com.whatsapp.w4b, com.google.android.apps.messaging]   # not Telegram: Remote's own chats
  quiet: "23:00-07:00"   # messages are only shown, not spoken, in this window (calls always speak)

island:                  # Karen Island (core/island.py): small capsule at the top centre; grows for replies, music, maps
  enabled: true
  top: 8                 # distance from the top of the screen (logical px)
  window_on_start: false # the big window stays hidden until opened from the island (right-click) or the tray
  hotkeys:               # global shortcuts (Ctrl+Alt+Space was already taken by another app on his PC)
    ask: ctrl+alt+k      # open the island's ask box from anywhere
    talk: ctrl+alt+t     # push-to-talk, no wake word

media:
  ytmusic_app_id: cinhimbnkkaeohfgghhklpknlkffjgod   # the YouTube Music web app in Edge

meeting:                 # after a meeting's notes are written (servers/meeting): where they go
  telegram: true          # the notes PDF + summary to his paired Telegram (Karen's bot)
  phone_note: true        # a note with the summary and action items in data/notes.json (syncs to the phone app)
night:                   # night mode (voice Karen): quieter voice and one-or-two-sentence answers
  window: "23:00-07:00"  # empty = off
  volume: 0.5            # 1 = normal loudness

evening:                 # Karen Remote sends a wrap-up to Telegram once a day (tomorrow's calendar, to-dos, reminders, mail)
  enabled: true
  time: "21:00"

alerts:                  # Karen Remote warns on Telegram once each time a line is crossed (checked every 10 min)
  pc_battery: 15         # % on battery power
  disk_free_gb: 3        # C: drive free space
  phone_battery: 15      # % (when the phone is on adb)

morning:                 # the first time she's with him each morning (start-up or after his first request), unasked
  enabled: true
  window: "05:00-11:30"
  request: "Good morning! Give me my morning briefing: today's weather, top news, today's reminders and calendar, and
    any important new emails. Keep it short and friendly."

face:                    # face unlock (core/face.py; enroll: scripts/enroll_face.py; on/off: Settings > Face unlock)
  threshold: 0.42        # SFace cosine score that counts as the user (OpenCV suggests 0.363; higher = stricter)
  check_s: 8             # how long she looks for his face before giving up
  relock_min: 30         # after this long with no requests, the next one needs his face again
  intruder_alert: true   # a face that isn't his: photo to data/intruders (last 20) + Telegram, at most every 5 min

remote:                  # Karen Remote (remote.py): Telegram / WhatsApp chat from the phone
  mail_reminders: true   # new Gmail with dates -> suggest reminders (tap ✅/❌ in Telegram), in the updates.mail_min scan
  keep_awake: plugged_in # keep the PC from sleeping while Remote runs: always (on battery too,
                         # down to 10%), plugged_in (never drains the battery), or off. The lid / power button still sleep.

updates:                 # what Karen Remote tells him unasked: the text, then her voice note, then one ring (calls:)
  mail: true             # important new Gmail: a real person, replies, deadlines, college, bills, security alerts
  mail_min: 15           # how often she looks; a look with no new mail makes no AI request
  event_lead_min: 15     # a heads-up this long before each calendar event (0 = off)
  morning: "08:00"       # morning briefing (today's plan, weather, overnight mail); "" = off. Evening: evening.time
  voice_notes: true      # her own voice (Kokoro) as a Telegram voice note with each update

calls:                   # the ring: CallMeBot (free) calls his Telegram and says only "Karen here. You have 2 important
                         # updates. Check our chat." Set up: Start on @CallMeBot_txtbot, then /callme to Karen
  enabled: true          # /calls off in Telegram pauses calls, /calls on resumes
  ring_for: [mail, event, reminder, briefing]
  quiet: "23:00-07:00"   # no calls, and updates arrive silently; a reminder that says "call me" / "wake me" still rings
  gap_min: 3             # at least this long between calls: news meanwhile waits and is counted in the next call
  max_per_day: 20
  at_pc_s: 120           # used the PC in the last 2 min and voice Karen is open: she says it aloud instead (0 = always ring)
  voice: en-IN-Standard-A  # CallMeBot's voice (Google "Standard" voices only)

app:                     # Karen's Android app (android/): its link to the PC runs inside Remote (core/appserver.py)
  enabled: false            # on after pairing a phone (scripts/phone_pair.py)
  port: 8788             # home Wi-Fi: <this PC's address>:8788 (Windows asks once to allow it on private networks)
  ngrok: true            # from anywhere: https://$NGROK_DOMAIN (unless WhatsApp's webhook already uses ngrok)

ig_reels:
  enabled: false

alexa:
  region: amazon.com      # the Amazon site your Alexa account uses (amazon.com, amazon.co.uk, ...)
  echo: ""                # which Echo runs free-form commands; empty = the first online one
  high_power:             # need a spoken yes: by Alexa device type, or by a word in the device's name
    types: [AIR_CONDITIONER, THERMOSTAT, WATER_HEATER, OVEN, MICROWAVE, WASHER, DRYER, DISHWASHER, SPACE_HEATER]
    names: [ac, a/c, air conditioner, heater, geyser, water heater, oven, microwave, iron, washing machine,
            washer, dryer, dishwasher, induction, kettle, motor, pump]

pc_control:
  apps: {}      # extra names -> exe path or command, e.g. {"vs code": code}. Start Menu apps work automatically.
  vision:
    model: deepseek/deepseek-v4.1-flash   # describes screenshots on request, via zero-data-retention providers
  whatsapp_browser: chrome   # where WhatsApp Web is signed in, used when no WhatsApp window is open
  screen_agent:   # operate: looks at the window (UI Automation list + screenshot) and clicks/types step by step
    model: deepseek/deepseek-v4.1-flash   # vision-capable, via OpenRouter zero-data-retention providers
    screenshots: true      # send a small screenshot each step (better at "the first song"); false = element list only
    max_steps: 12
    settle_s: 1.2          # wait after each action before looking again
  power_mode:   # Open Interpreter writes and runs code (The user's choice); asks before the task and before risky steps
    python: "%LOCALAPPDATA%/Programs/Python/Python312/python.exe"   # the Python that has open-interpreter
    model: deepseek/deepseek-v4.1-flash   # via OpenRouter, zero-data-retention providers
    max_steps: 8
    timeout_s: 240

daily:
  city: ""                       # home city for weather and the briefing, e.g. Chennai
  news_region: "hl=en-IN&gl=IN&ceid=IN:en"   # Google News edition (CHANGE_SETTINGS.bat sets the country)

files:
  read_chars: 12000       # how much of a file's text the AI gets at once
  vision_model: deepseek/deepseek-v4.1-flash

dev:
  project_roots: ["%USERPROFILE%/Desktop", "%USERPROFILE%/Documents", "%USERPROFILE%/source/repos"]   # folders here count as projects
  projects: {}            # extra names -> folders, e.g. {rover: "D:/code/rover"}
